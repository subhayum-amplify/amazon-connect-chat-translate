version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --legacy-peer-deps --prefer-offline --no-audit --cache .npm
        - echo "Installing tsx for TypeScript execution..."
        - npm install tsx --no-save
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps --prefer-offline --no-audit --cache .npm --silent
        - echo "Node version:" && node --version
        - echo "NPM version:" && npm --version
    build:
      commands:
        - echo "Starting build process..."
        - REACT_APP_CONNECT_REGION=${REACT_APP_CONNECT_REGION}
        - REACT_APP_CONNECT_INSTANCE_ID=${REACT_APP_CONNECT_INSTANCE_ID}
        - craco build
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*